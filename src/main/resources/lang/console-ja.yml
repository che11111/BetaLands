  bluemap-synchronized: "BlueMap データを BlueMap に送信しました。"
  refresh-slow: "地図マーカーの更新に {milliseconds} ミリ秒かかりました。"
  dynmap-updated: "Dynmap の土地 {lands} 件を、マーカー {markers} 件で更新しました。"
  dynmap-world-missing: "Dynmap で {count} 件の土地の Bukkit ワールドが見つからなかったため、保存されたワールド名を使用しました。"
  dynmap-api-waiting: "Dynmap は導入されていますが、Marker API が初期化されていません。configuration.txt で org.dynmap.MarkersComponent を有効にしてください。BetaLands は確認を続けます。"
  dynmap-plugin-unavailable: "Dynmap に接続できません（{state}）。BetaLands は確認を続けます。"
