  migration-warning: "Towny 移行の警告：{warning}"
  migration-complete: "Towny 移行完了。移行元={source}、町={towns}、ブロック={blocks}、サブ領地={subclaims}、追加={added}、更新={updated}、競合={conflicts}"
  import-failed: "Towny のインポートに失敗しました：{error}"

economy:
  hook-failed: "iConomy に接続できませんでした：{error}"

admin:
  reloaded-v2: "設定、土地レベル、再読み込み可能な連携を更新しました。"
  status-header: "BetaLands ステータス"
  status-counts: "土地={lands}、プレイヤー={players}、外部建設解放={hours} 時間"
  status-economy-scaled: "経済={economy}、既定レベル={level}、レベル数={levels}、作成={create}、保護申請={claim}+{increment}*チャンク、サブ領地/ブロック={subBlock}"
